<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Resume Screener</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><p class="eyebrow">TALENT INTELLIGENCE</p><h1>Smart Resume Screener</h1><p>Upload resumes, add a job description, and generate an evidence-based shortlist.</p></header>
<section class="grid"><article><h2>1. Add candidates</h2><form id="upload-form"><label>Upload PDF or text resume<input id="file" type="file" accept=".pdf,.txt" required></label><button>Upload and parse</button></form><p class="or">or paste a resume</p><form id="text-form"><textarea id="resume-text" placeholder="Jane Doe&#10;jane@example.com&#10;Python, FastAPI, SQL..." required></textarea><button>Save pasted resume</button></form><div id="candidate-list"></div></article>
<article><h2>2. Describe the role</h2><form id="job-form"><label>Job title<input id="job-title" value="Backend Engineer" required></label><label>Job description<textarea id="job-description" required>We need a Backend Engineer with Python, FastAPI, SQL, PostgreSQL, Docker, AWS, REST APIs and 3+ years of experience.</textarea></label><button>Create job and screen candidates</button></form><p id="status" role="status"></p></article></section>
<section><div class="results-heading"><div><p class="eyebrow">RANKED SHORTLIST</p><h2>Candidate assessments</h2></div><span id="method-note">Create a job to begin.</span></div><div id="results" class="results"><p class="empty">No assessments yet.</p></div></section></main><script src="/static/app.js"></script></body></html>
